<div
  class="sheet-overlay"
  role="dialog"
  aria-modal="true"
  aria-label="Bottom sheet"
  (click)="onBackdropClick()"
>
  <section
    class="sheet-panel"
    [class.sheet-panel--dragging]="isDragging()"
    [style.transform]="dragOffset() ? 'translateY(' + dragOffset() + 'px)' : null"
    (click)="$event.stopPropagation()"
    (touchstart)="onSheetTouchStart($event)"
    (touchmove)="onSheetTouchMove($event)"
    (touchend)="onSheetTouchEnd($event)"
    (touchcancel)="onSheetTouchEnd($event)"
  >
    <div class="sheet-handle" aria-hidden="true"></div>
    <router-outlet />
  </section>
</div>
